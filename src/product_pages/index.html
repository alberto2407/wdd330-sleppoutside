<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sleep Outside | Product Details</title>
    <link rel="icon" type="image/svg+xml" href="/images/noun_Tent_2517.svg" />
    <link rel="stylesheet" href="/css/style.css" />
    <script src="/js/product.js" type="module"></script>
  </head>

  <body>
    <header class="divider" id="main-header"></header>

    <main class="divider">
      <section class="product-detail">
        <h1 id="productBrand">Brand Name</h1>
        <h2 class="divider" id="productName">Product</h2>
        <img
          class="divider"
          id="productImage"
          src="/images/placeholder.jpg"
          alt="Product Image"
        />
        <div id="productPrice"></div>
        <p id="productColor" class="product__color">Color</p>
        <p id="productDescription" class="product__description">Description</p>
        <div class="product-detail__add">
          <button id="addToCart">Add to Cart</button>
        </div>
      </section>
    </main>

    <footer id="main-footer"></footer>
  </body>
</html>
