<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sleep Outside | Home</title>
    <link rel="icon" type="image/svg+xml" href="/images/noun_Tent_2517.svg" />
    <link rel="stylesheet" href="/css/style.css" />
    <script type="module" src="/js/main.js"></script>
  </head>

  <body>
    <header class="divider" id="main-header"></header>
    <nav aria-label="breadcrumb" class="breadcrumbs" id="breadcrumbs"></nav>
    <main class="divider">
      <div class="hero">
        <img
          src="/images/banner-sm.jpg"
          srcset="/images/banner-sm.jpg 500w, /images/banner.jpg 1080w"
          sizes="(max-width: 500px) 500px, 1080px"
          alt="image of a high mountain lake"
        />
        <div class="logo logo--square">
          <img src="/images/noun_Tent_2517.svg" alt="tent image for logo" />
          <div>Sleep<span class="highlight">Outside</span></div>
        </div>
        <div class="mission">
          <p>
            Our mission is to provide you with everything you need to sleep
            outside comfortably at an affordable price.
          </p>
        </div>
      </div>

      <section class="categories">
        <h1>Shop by Category</h1>
        <div class="category">
          <a href="/product_listing/?category=tents" class="category-card">
            <img src="/images/categories/tents.svg" alt="Tents" />
            <h2>Tents</h2>
          </a>
          <a href="/product_listing/?category=backpacks" class="category-card">
            <img src="/images/categories/backpacks.svg" alt="Backpacks" />
            <h2>Backpacks</h2>
          </a>
          <a
            href="/product_listing/?category=sleeping-bags"
            class="category-card"
          >
            <img
              src="/images/categories/sleeping-bags.svg"
              alt="Sleeping Bags"
            />
            <h2>Sleeping Bags</h2>
          </a>
          <a href="/product_listing/?category=hammocks" class="category-card">
            <img src="/images/categories/hammocks.svg" alt="Hammocks" />
            <h2>Hammocks</h2>
          </a>
        </div>
      </section>

      <section class="newsletter-signup">
        <h2>Join Our Newsletter</h2>
        <p>
          Get exclusive deals, outdoor tips, and early access to new products.
        </p>
        <form id="newsletter-form" class="newsletter-form">
          <label for="newsletter-email" class="visually-hidden"
            >Email address</label
          >
          <input
            type="email"
            id="newsletter-email"
            name="email"
            placeholder="Enter your email address"
            required
            autocomplete="email"
          />
          <button type="submit" class="newsletter-button">Subscribe</button>
        </form>
        <p id="newsletter-message" class="newsletter-message hide"></p>
      </section>
    </main>
    <footer id="main-footer"></footer>
  </body>
</html>
