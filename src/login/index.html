<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sleep Outside | Login</title>
    <link rel="icon" type="image/svg+xml" href="/images/noun_Tent_2517.svg" />
    <link rel="stylesheet" href="/css/style.css" />
    <script type="module" src="/js/login.js"></script>
  </head>

  <body>
    <header class="divider" id="main-header"></header>
    <nav aria-label="breadcrumb" class="breadcrumbs" id="breadcrumbs"></nav>
    <main class="divider">
      <section class="login-container">
        <h1>Admin Login</h1>
        <p class="login-subtitle">
          Please sign in to access the orders dashboard.
        </p>

        <form id="login-form" class="login-form">
          <fieldset>
            <legend>Credentials</legend>

            <label for="email">Email</label>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="admin@example.com"
              required
              autocomplete="email"
            />

            <label for="password">Password</label>
            <input
              type="password"
              id="password"
              name="password"
              placeholder="Enter your password"
              required
              autocomplete="current-password"
            />
          </fieldset>

          <button type="submit" class="login-submit">Sign In</button>
        </form>

        <p id="login-message" class="login-message hide"></p>

        <div class="login-register-link">
          <p>Don't have an account?</p>
          <a href="/register/" class="register-cta">Create one now</a>
        </div>
      </section>
    </main>
    <footer id="main-footer"></footer>
  </body>
</html>
